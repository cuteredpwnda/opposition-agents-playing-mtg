# Docker Compose override for running on a larger remote machine.
#
# This adds the training container alongside Neo4j + Ollama, giving you
# a single `docker compose up` that runs the full training pipeline on
# a remote GPU/high-memory server.
#
# Usage:
#   # On the remote machine:
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d
#
#   # Just train:
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml run trainer --train --iters 100
#
#   # Transfer learning (Standard→Commander):
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml run trainer --transfer
#
#   # Watch logs:
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml logs -f trainer

services:
  # Override neo4j with more memory for large-scale training
  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G

  # Ollama LLM server — pull models as needed
  ollama:
    image: ollama/ollama:latest
    container_name: mtg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU passthrough (uncomment for NVIDIA GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Training container — runs the full pipeline
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtg-trainer
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mtgpassword
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./data:/app/data
    # GPU passthrough (uncomment for NVIDIA GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Default: run full pipeline
    # Override with: docker compose run trainer --train --commander
    command: ["--all", "--commander"]

volumes:
  ollama_data:
