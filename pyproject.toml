[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opposition-agents-mtg"
version = "0.1.0"
description = "Knowledge-graph-grounded JEPA world models and active-inference LLM agents for Magic: The Gathering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felix Neubürger" }]
keywords = [
    "magic-the-gathering",
    "mtg",
    "world-models",
    "jepa",
    "knowledge-graph",
    "active-inference",
    "llm-agents",
    "self-play",
    "reinforcement-learning",
    "neuro-symbolic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://github.com/cuteredpwnda/opposition-agents-playing-mtg"
Repository = "https://github.com/cuteredpwnda/opposition-agents-playing-mtg"
Issues = "https://github.com/cuteredpwnda/opposition-agents-playing-mtg/issues"
Documentation = "https://github.com/cuteredpwnda/opposition-agents-playing-mtg/tree/main/docs"

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # LLM / Agent framework
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-community>=0.3",
    "langchain-neo4j>=0.2",

    # Neo4j
    "neo4j>=5.20",

    # Scryfall
    "scrython>=2.0",

    # HTTP
    "httpx>=0.27",

    # Async
    "asyncio-extra>=1.0; python_version<'3.12'",

    # Data
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",

    # Config / logging
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=23.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torch-geometric>=2.5",
    "torchmetrics>=1.0",
    "lightning>=2.1",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "tensorboard>=2.14",
    "pymdp>=0.1",
]
ontology = [
    "rdflib>=7.0",
    "owlrl>=6.0",
    "pyshacl>=0.23",
    "spacy>=3.7",
    "nltk>=3.8",
    "transformers>=4.35",
    "requests>=2.31",
]
ui = [
    "streamlit>=1.30",
    "pygame>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.9",
]
all = ["opposition-agents-mtg[ml,ontology,ui,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
